<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phone call</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1040px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.pc-stage{position:relative;overflow:hidden;touch-action:pan-y;outline:none;cursor:zoom-in}
.pc-stage[data-zoomed]{cursor:zoom-out}
.pc-stage>svg,.pc-stage>canvas{display:block;width:100%;height:auto}
.pc-stage>.pc-layer{position:absolute;inset:0;height:100%!important;pointer-events:none}
.iso:not([data-theme="light"]) .pc-gl{mix-blend-mode:screen}
.pc-stage:focus-visible{box-shadow:0 0 0 1px var(--anatomy-mid)}
.pc-stage .mouth{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:.5;vector-effect:non-scaling-stroke}
.pc-stage .beacon{fill:var(--anatomy-red);opacity:.5}
.pc-stage .leds circle{fill:var(--anatomy-faint);transition:fill .25s,opacity .25s}
.pc-stage .leds[data-on] circle{fill:var(--anatomy-lit)}
.pc-stage .scope-glass{fill:var(--anatomy-paper)}
.pc-stage .scope-samples{fill:none;stroke:var(--anatomy-lit);stroke-width:1.6;stroke-linecap:round}
.pc-stage .radio-link .iso-line{stroke:var(--anatomy-blue);stroke-dasharray:2 3;opacity:.55}
.pc-stage .radio-link .iso-wire-end{stroke:var(--anatomy-blue)}
.pc-stage[data-gl] .radio-link{opacity:.35}
.pc-front .pk{fill:var(--anatomy-lit)}
.pc-front .pk[data-dir="BA"]{fill:var(--anatomy-paper);stroke:var(--anatomy-lit);stroke-width:.8;vector-effect:non-scaling-stroke}
.pc-fallback circle{fill:none;stroke-width:.8;vector-effect:non-scaling-stroke}
.pc-fallback .snd{stroke:var(--anatomy-red)}
.pc-fallback .rad{stroke:var(--anatomy-blue)}
.pc-stage[data-gl] .pc-fallback{display:none}
.pc-stage[data-route="pstn"] [data-dim]{opacity:.35}

.pc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 14px 12px;border-top:1px solid var(--anatomy-faint);font:11px/1.2 var(--anatomy-mono,ui-monospace,monospace);letter-spacing:.04em}
.pc-bar button,.pc-learn button{font:inherit;color:var(--anatomy-text);background:transparent;border:1px solid var(--anatomy-faint);border-radius:4px;padding:5px 9px;cursor:pointer}
.pc-bar button:hover,.pc-learn button:hover{border-color:var(--anatomy-lo);color:var(--anatomy-strong)}
.pc-bar button[aria-pressed="true"],.pc-learn button[aria-pressed="true"]{color:var(--anatomy-strong);border-color:var(--anatomy-mid);background:var(--anatomy-face)}
.pc-bar .pc-primary{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}
.pc-bar .pc-talk[data-held]{background:var(--anatomy-face);border-color:var(--anatomy-hi);color:var(--anatomy-strong)}
.pc-seg{display:inline-flex;gap:0}
.pc-seg button{border-radius:0;margin-left:-1px}
.pc-seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}
.pc-seg button:last-child{border-radius:0 4px 4px 0}
.pc-sep{width:1px;height:18px;background:var(--anatomy-faint);margin:0 4px}
.pc-label{color:var(--anatomy-muted);text-transform:uppercase}

.pc-learn{margin-top:28px;font-size:14px}
.pc-tabs{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;font:11px/1.2 var(--anatomy-mono,ui-monospace,monospace);letter-spacing:.04em}
.pc-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:16px 0 18px}
.pc-steps .pc-step{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:7px 9px;font:12px/1.3 ui-sans-serif,system-ui,sans-serif;min-height:44px}
.pc-steps .pc-step b{font:600 11px/1.5 var(--anatomy-mono,ui-monospace,monospace);color:var(--anatomy-muted)}
.pc-steps .pc-step[aria-pressed="true"] b{color:var(--anatomy-strong)}
.pc-text h2{margin:0 0 6px;font-size:18px;font-weight:600;color:var(--anatomy-strong)}
.pc-text>p{margin:0 0 12px;max-width:72ch}
.pc-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.pc-pair p{margin:0;padding:10px 12px;border:1px solid var(--anatomy-faint);border-radius:6px;font-size:13px}
.pc-pair b{display:block;font:600 10px/1.6 var(--anatomy-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.08em;color:var(--anatomy-muted);margin-bottom:2px}
.pc-route{font-size:13px;color:var(--anatomy-muted);max-width:80ch}
.pc-budget{margin-top:18px;border-top:1px solid var(--anatomy-faint);padding-top:12px}
.pc-budget-head{display:flex;justify-content:space-between;font:11px/1.4 var(--anatomy-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.06em;color:var(--anatomy-muted)}
.pc-budget-head span:last-child{color:var(--anatomy-strong)}
.pc-bars{position:relative;display:flex;height:30px;margin:8px 0 6px;border:1px solid var(--anatomy-faint);border-radius:4px;overflow:hidden}
.pc-bars button{all:unset;cursor:pointer;position:relative;border-right:1px solid var(--anatomy-faint);background:var(--anatomy-face);min-width:3px;font:10px/30px var(--anatomy-mono,ui-monospace,monospace);color:var(--anatomy-muted);text-align:center;overflow:hidden;white-space:nowrap}
.pc-bars button:last-of-type{border-right:0}
.pc-bars button[aria-pressed="true"]{background:var(--anatomy-top);color:var(--anatomy-strong)}
.pc-bars i{position:absolute;top:0;bottom:0;width:1.5px;background:var(--anatomy-lit);pointer-events:none;left:0}
.pc-budget-foot{font-size:12px;color:var(--anatomy-muted)}
@media (max-width:720px){
  .pc-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pc-pair{grid-template-columns:1fr}
  .pc-sep{display:none}
}
.pc-stage .iso-svg{overflow:hidden}
@media (max-width:600px){.iso-plate-corner[data-corner="hint"]{display:none}}

const GLSL_ISO = `precision highp float;
uniform vec2 uCanvas;
uniform vec2 uView;
uniform vec2 uOrigin;
uniform float uK;
uniform vec4 uCam;
uniform float uTime;
vec2 viewOf(vec2 frag){return vec2(frag.x,uCanvas.y-frag.y)*(uView.x/uCanvas.x);}
vec2 project(vec3 p){return uOrigin+uK*vec2(p.x*uCam.x-p.y*uCam.y,(p.x*uCam.y+p.y*uCam.x)*uCam.z-p.z*uCam.w);}
vec3 towardViewer(){return vec3(uCam.y*uCam.w,uCam.x*uCam.w,uCam.z);}
vec3 rayOf(vec2 vb){vec2 q=(vb-uOrigin)/uK;return vec3(q.x*uCam.x,-q.x*uCam.y,-q.y/uCam.w);}
float pixelOf(){return (uView.x/uCanvas.x)/uK;}
vec3 lightDir(){return normalize(vec3(-uCam.x,uCam.y,1.2));}
vec3 onFloor(vec2 vb,float h){vec2 q=(vb-uOrigin)/uK;float b=(q.y+h*uCam.w)/uCam.z;return vec3(q.x*uCam.x+b*uCam.y,-q.x*uCam.y+b*uCam.x,h);}
vec3 onWallY(vec2 vb,float y){vec2 q=(vb-uOrigin)/uK;float x=(q.x+y*uCam.y)/uCam.x;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}
vec3 onWallX(vec2 vb,float x){vec2 q=(vb-uOrigin)/uK;float y=(x*uCam.x-q.x)/uCam.y;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}
float hash12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float hash13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float noise2(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),f.x),mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),f.x),f.y);}
float noise3(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.-2.*f);
  float a=mix(mix(hash13(i),hash13(i+vec3(1.,0.,0.)),f.x),mix(hash13(i+vec3(0.,1.,0.)),hash13(i+vec3(1.,1.,0.)),f.x),f.y);
  float b=mix(mix(hash13(i+vec3(0.,0.,1.)),hash13(i+vec3(1.,0.,1.)),f.x),mix(hash13(i+vec3(0.,1.,1.)),hash13(i+vec3(1.,1.,1.)),f.x),f.y);
  return mix(a,b,f.z);}
float fbm2(vec2 p){float s=0.;float a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.07+vec2(17.1,9.2);a*=.5;}return s/.9375;}
float fbm3(vec3 p){float s=0.;float a=.5;for(int i=0;i<4;i++){s+=a*noise3(p);p=p*2.07+vec3(17.1,9.2,4.7);a*=.5;}return s/.9375;}
float window(float x,float a,float b,float soft){return smoothstep(a-soft,a+soft,x)*(1.-smoothstep(b-soft,b+soft,x));}
vec3 tonemap(vec3 c,float exposure){return 1.-exp(-c*exposure);}
`;

const GLSL_TURN = `uniform vec3 uGroupX;
uniform vec3 uGroupY;
uniform vec3 uGroupZ;
uniform vec3 uGroupT;
uniform vec3 uCoverEdge[60];
uniform float uCoverCount[6];
vec3 toGroup(vec3 p){vec3 q=p-uGroupT;return vec3(dot(q,uGroupX),dot(q,uGroupY),dot(q,uGroupZ));}
vec3 toWorld(vec3 g){return uGroupT+g.x*uGroupX+g.y*uGroupY+g.z*uGroupZ;}
vec3 dirToGroup(vec3 d){return vec3(dot(d,uGroupX),dot(d,uGroupY),dot(d,uGroupZ));}
vec3 dirToWorld(vec3 d){return d.x*uGroupX+d.y*uGroupY+d.z*uGroupZ;}
float coverOf(vec2 vb,float soft){float c=0.;for(int p=0;p<6;p++){float n=uCoverCount[p];float inside=-1e4;for(int e=0;e<10;e++){if(float(e)>=n)break;vec3 h=uCoverEdge[p*10+e];inside=max(inside,h.x*vb.x+h.y*vb.y+h.z);}if(n>0.)c=max(c,1.-smoothstep(-soft,soft,inside));}return c;}
`;

function glslPose(name, prefix = `u${name}`) {
  return `uniform vec3 ${prefix}X;uniform vec3 ${prefix}Y;uniform vec3 ${prefix}Z;uniform vec3 ${prefix}T;
vec3 to${name}(vec3 p){vec3 q=p-${prefix}T;return vec3(dot(q,${prefix}X),dot(q,${prefix}Y),dot(q,${prefix}Z));}
vec3 from${name}(vec3 g){return ${prefix}T+g.x*${prefix}X+g.y*${prefix}Y+g.z*${prefix}Z;}
vec3 dirTo${name}(vec3 d){return vec3(dot(d,${prefix}X),dot(d,${prefix}Y),dot(d,${prefix}Z));}
vec3 dirFrom${name}(vec3 d){return d.x*${prefix}X+d.y*${prefix}Y+d.z*${prefix}Z;}
`;
}

function glCamera(projection) {
  const a = ((projection.azimuth ?? 45) * Math.PI) / 180;
  const e = ((projection.elevation ?? 30) * Math.PI) / 180;
  return {
    origin: [projection.origin[0], projection.origin[1]],
    k: projection.scale * Math.sqrt(1.6),
    cam: [Math.sin(a), Math.cos(a), Math.sin(e), Math.cos(e)],
  };
}

const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));
    return null;
  };
  const vs = compile(gl.VERTEX_SHADER, VERTEX);
  const enabled = extensions.filter((name) => gl.getExtension(name.replace(/^GL_/, "")));
  const fs = compile(gl.FRAGMENT_SHADER, enabled.map((name) => `#extension ${name} : enable\n`).join("") + GLSL_ISO + fragment);
  if (!vs || !fs) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);
    if (info) types[info.name.replace(/\[0\]$/, "")] = info.type;
  }
  let painted = false;
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  };
  const set = (name, value) => {
    const at = where[name];
    if (at === undefined || at === null) return;
    if (typeof value === "number") gl.uniform1f(at, value);
    else if (value.length > 4) {
      const data = value instanceof Float32Array ? value : new Float32Array(value);
      const type = types[name];
      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);
      else gl.uniform1fv(at, data);
    }
    else if (value.length === 1) gl.uniform1f(at, value[0]);
    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);
  };
  for (const [name, value] of Object.entries(fixed)) set(name, value);
  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }

{"id":3,"ms":26.5},{"id":4,"ms":15},{"id":5,"ms":8},{"id":6,"ms":17.19607843137255},{"id":7,"ms":30.88235294117647},{"id":8,"ms":16.490196078431374},{"id":9,"ms":63.87463556851312}],"pstn":[{"id":1,"ms":0.8746355685131195},{"id":2,"ms":0.5},{"id":3,"ms":0.125},{"id":4,"ms":0.05},{"id":5,"ms":2},{"id":6,"ms":17.19607843137255},{"id":7,"ms":30.88235294117647},{"id":8,"ms":2.5401960784313724},{"id":9,"ms":1.8746355685131195}]},"steps":[{"id":1,"title":"Speaking makes waves in the air","station":"voiceA","beginner":"When Elif talks, her voice box buzzes and pushes the air, like a hand pushing water in a bath. The pushes spread out as waves and reach her phone.","intermediate":"Vocal folds vibrate about 100–250 times a second; the throat and mouth shape that buzz into vowels and consonants. Each push squeezes the air a little (compression) and each pull thins it (rarefaction). These pressure changes travel at 343 m/s, so they cross 30 cm to the phone in under a millisecond.","advanced":"Speech is a pressure signal of about 0.02–1 Pa around the 101,325 Pa of the atmosphere. Its energy sits mostly below 4 kHz, but consonants carry information up to 8 kHz and beyond. The wave is longitudinal: the air moves back and forth along the direction of travel, it does not flow from Elif to the phone. The rings shown are the 3 kHz part of the voice (wavelength 11 cm).","analogy":"Ripples in a bath are a picture of the idea; real sound is squeezing and stretching of air, not up-and-down waves.","real":"0.3 m ÷ 343 m/s ≈ 0.9 ms."},{"id":2,"title":"The microphone turns air into numbers","station":"phoneA","beginner":"Inside the phone there is a microphone smaller than a grain of rice. It has a tiny skin that wobbles with the air. The phone measures the wobble again and again, very fast, and writes down a number each time.","intermediate":"A MEMS microphone is a silicon membrane next to a fixed plate. When pressure moves the membrane, the gap changes and so does the capacitance, which becomes a voltage. An analog-to-digital converter (ADC) then measures that voltage thousands of times a second and turns each measurement into a number.","advanced":"Phone mics are usually sigma-delta: they output a 1-bit stream at about 2.4–3 MHz (PDM), and a decimation filter turns it into 16-bit samples at 16 kHz for a wideband call (48 kHz inside the phone, resampled). Sampling at 16 kHz captures frequencies up to 8 kHz (Nyquist); an anti-alias filter removes anything above. Each sample is one number on the scope: the dots on the wave.","analogy":"“Writing down a number” is real: every sample is a binary number.","real":"16,000 samples a second × 16 bits = 256 kbit/s before compression."},{"id":3,"title":"The numbers are squeezed and packed","station":"phoneA","beginner":"There are too many numbers to send them all, so the phone keeps only what your ear needs, like a short note instead of a long letter. It puts each little piece of voice in an envelope with an address on it.","intermediate":"A speech codec (AMR-WB or EVS on mobile calls, Opus in most apps) collects 20 ms of audio, models how a vocal tract would make that sound, and sends the model's settings instead of the raw samples. This cuts 256 kbit/s down to about 13–24 kbit/s. Each 20 ms frame goes into a packet with a header: 50 packets a second.","advanced":"AMR-WB is ACELP: it sends linear-prediction coefficients (the vocal-tract filter), pitch lag and gain, and a fixed-codebook excitation, 20 ms per frame with 5 ms look-ahead. The frame rides in RTP over UDP over IP; on LTE the 40-byte IP/UDP/RTP header is compressed by ROHC to a few bytes. The codec cannot send a frame until it has heard all of it, so framing costs about 25 ms: the biggest fixed delay in the phone.","analogy":"The envelope is a fair picture of a packet: a header with addresses, then the payload.","real":"AMR-WB at 12.65 kbit/s: 253 bits of voice per 20 ms frame."},{"id":4,"title":"The phone talks to the tower by radio","station":"mastA","beginner":"The phone shouts the envelopes to the nearest tower using radio waves. Radio is a kind of light your eyes cannot see, so it goes through the air and through walls.","intermediate":"The modem turns bits into radio: it changes the phase and strength of a high-frequency wave (around 1.8 GHz in Turkey's LTE band 3) to carry the data. The tower decides who may send when, in 1 ms slots, and the phone waits for its slot. The waves themselves reach the tower 400 m away in about 1.3 µs; almost all of this stage is waiting for the slot and checking it arrived.","advanced":"LTE uplink uses SC-FDMA (downlink OFDMA) on 15 kHz subcarriers, QPSK to 256-QAM, with turbo or LDPC coding and HARQ retransmissions every 8 ms. A VoLTE call gets a dedicated bearer (QCI 1) with guaranteed bit rate, often with semi-persistent scheduling so the phone need not ask for every slot. Up and down links use different frequencies (FDD), which is part of why both people can talk at once.","analogy":"The rings drawn here are slowed down enormously; at true speed they would cross the 400 m in 1.3 µs and could not be seen.","real":"Radio flight ≈ 0.0013 ms; scheduling and HARQ ≈ 8 ms."},{"id":5,"title":"The network finds the way","station":"coreA","beginner":"The tower hands the envelopes to a big building full of computers. They read the address on each envelope and send it the right way, like a post office sorting letters.","intermediate":"From the tower's baseband unit the packets go over fibre (backhaul) to the operator's core network. When the call started, signalling (SIP) found Sam's network and agreed the codec. Now the voice packets simply follow that route: through the packet core, then a border gateway towards international carriers.","advanced":"The eNodeB (or 5G gNodeB) tunnels the packets in GTP-U to the S-GW and P-GW (5G: UPF). The IMS core (P-CSCF, S-CSCF) handled the SIP INVITE and SDP offer/answer; an SBC sits at the border. International hand-off goes over an IPX network between operators, or through a TDM gateway where an older network needs it, sometimes with transcoding that adds delay and loses quality.","analogy":"The post office is a fair analogy for routing; but the route is set up once at the start and each packet is forwarded in microseconds.","real":"Backhaul, core and border ≈ 5 ms."},{"id":6,"title":"Light in a glass thread","station":"spoolA","beginner":"Now the envelopes become flashes of light inside a glass thread thinner than a hair. Light is the fastest thing there is. It could go around the whole Earth five times in one second.","intermediate":"A laser switches on and off (and shifts its phase) billions of times a second to send the bits. The light stays inside the glass because the core is surrounded by glass that bends it back in. From Istanbul it travels about 3,100 km over land through Europe to the British coast, passing through a few routers on the way. Many calls share one fibre: each conversation is a tiny slice of the traffic.","advanced":"Long-haul links use single-mode fibre (9 µm core, 125 µm cladding) at about 1550 nm, where loss is about 0.2 dB/km. Light travels at c/n ≈ 204,000 km/s: 4.9 µs per km. Dense wavelength-division multiplexing puts 80 or more colours on one fibre, each carrying 100–800 Gbit/s with coherent QPSK/QAM. Erbium-doped fibre amplifiers boost the light every 80 km or so, without turning it back into electricity.","analogy":"Light “bouncing” off the walls is a ray picture; in single-mode fibre the light travels as one guided mode along the core. Real fibre light is infrared and invisible.","real":"3,100 km × 4.9 µs/km ≈ 15 ms, plus about 2 ms of router hops."},{"id":7,"title":"Across the ocean floor","station":"sea","beginner":"To cross the sea the glass threads lie on the ocean floor inside a strong cable, as thick as a garden hose. Every so often a little box makes the light bright again so it does not fade.","intermediate":"About 99% of traffic between continents goes through submarine cables, not satellites. A transatlantic cable such as Grace Hopper runs about 6,300 km from Cornwall to Long Island. In deep water it is only about 2 cm thick: a few fibre pairs, a copper tube that carries power, and plastic. Near the shore it is armoured with steel wire against anchors and fishing nets.","advanced":"Repeaters every 60–80 km hold erbium-doped fibre amplifiers, pumped by lasers powered over the cable's copper conductor at up to about 15 kV DC from power-feed equipment at each landing station. Modern cables carry 12–24 fibre pairs at up to 25 Tbit/s per pair. A satellite in geostationary orbit would add about 240 ms each way; this cable adds about 31 ms.","analogy":"The bench shows five repeaters; a real 6,300 km cable has about 90.","real":"6,300 km × 4.9 µs/km ≈ 31 ms."},{"id":8,"title":"New York's network delivers it","station":"coreB","beginner":"On the other side the light becomes envelopes again. New York's network reads the address, finds Sam's phone and sends it to the tower near him, which shouts it to his phone by radio.","intermediate":"The cable lands at a landing station on Long Island, and land fibre carries the packets about 100 km to Sam's operator in Manhattan. Its core network knows which cell Sam's phone is in (it registered when he switched it on) and sends the packets to that tower, which sends them down to the phone by radio.","advanced":"The terminating IMS routes the media through its SBC and packet core to Sam's serving eNodeB/gNodeB, again over a GTP-U tunnel. Downlink scheduling is usually quicker than uplink because the base station has the data already. If the receiving network uses a different codec, a transcoder converts it, adding delay; when both ends support the same codec (transcoder-free operation) the frames pass through unchanged.","analogy":"“Finding Sam's phone” happened when the call was set up; each packet just follows that route.","real":"Metro fibre 0.5 ms, core 5 ms, downlink radio about 5 ms."},{"id":9,"title":"The phone turns numbers back into sound","station":"phoneB","beginner":"Sam's phone opens each envelope and reads the numbers. It uses them to push a tiny speaker in and out, exactly like Elif's voice pushed the air. The air carries the waves to Sam's ear, and he hears Elif.","intermediate":"Packets arrive a little unevenly, so the phone holds a few in a jitter buffer and plays them at a steady pace. The decoder rebuilds the 16,000 samples a second from the codec's settings; a digital-to-analog converter (DAC) turns them into a voltage; an amplifier drives the speaker coil, and the cone pushes the air.","advanced":"An adaptive jitter buffer (typically 20–80 ms) trades delay for smooth playback; if a packet is lost, packet-loss concealment invents a plausible 20 ms from its neighbours. The ACELP decoder synthesises the waveform; a sigma-delta DAC and a class-D amplifier drive the voice coil, which sits in a magnet's field and moves with the current (Lorentz force), pushing the diaphragm.","analogy":"“The same as her voice” is close but not exact: the codec rebuilds something that sounds like it, not the identical waveform.","real":"Jitter buffer about 40 ms, decode and DAC about 3 ms, air to the ear about 0.9 ms."},{"id":10,"title":"Both talk at once, with little delay","station":"all","beginner":"All of this happens in both directions at the same time, on two separate paths, so Elif and Sam can talk and laugh together. The whole trip takes less time than a blink.","intermediate":"Each direction has its own packets and its own fibre in each pair, and radio uses separate frequencies for up and down. The phone cancels the echo of the other person's voice so it is not sent back. When the one-way delay stays under about 150 ms, people take turns naturally; above about 300 ms they start talking over each other.","advanced":"Full duplex comes from FDD (or TDD time slots on 5G), separate fibres per direction, and independent RTP streams. Acoustic echo cancellation subtracts the speaker signal from the mic signal with an adaptive filter. ITU-T G.114 recommends at most 150 ms one-way for most users; this model gives about 142 ms for VoLTE Istanbul→New York. A landline circuit is faster (no codec framing or jitter buffer); an app call over the internet is usually a little slower.","analogy":"“Less than a blink” is literal: a blink lasts about 100–400 ms.","real":"Round trip, Elif to Sam and back, about 285 ms on this route."}],"routes":{"volte":"A VoLTE call is a phone call carried as data packets over 4G (VoNR on 5G). The operator gives it priority on the radio and in its network (a guaranteed bearer) and connects to the other operator through IMS. Most phone calls today are carried like this.","app":"An app call (WhatsApp, FaceTime, Signal) uses the same towers and cables, but its packets travel as ordinary internet data with no priority, encrypted end to end, usually with the Opus codec. It often goes directly between the phones, or through the app's relay server when it can't.","pstn":"On the old public switched telephone network (PSTN), a copper pair links the phone to the local exchange, which samples the voice 8,000 times a second (G.711, 64 kbit/s) and reserves a fixed 125 µs time slot all the way to the other end: a circuit, not packets. There is no codec framing or jitter buffer, so it is quicker, but the reserved slot is used even during silence. Its long-distance legs ride on the same fibres and sea cables. On the bench, picture each phone and mast replaced by a desk phone on a copper pair to its exchange."},"routeNames":{"volte":"Mobile call (VoLTE)","app":"App call (WhatsApp, FaceTime…)","pstn":"Landline (PSTN)"},"boxes":{"all":[0,0,1000,470],"voiceA":[5.25,100.59,220.47,103.62],"phoneA":[21.81,114.43,239.6,112.61],"mastA":[-20.26,33,377.57,177.46],"coreA":[18,33,443.23,208.32],"spoolA":[145.42,129.8,297.39,139.78],"sea":[322.33,182.9,355.33,167.01],"coreB":[540.78,157.01,397,186.59],"phoneB":[750.88,256.14,247.43,116.29]},"src":{"mouthA":[-496.2734516442594,-22.35225107234309,53.5],"mouthB":[496.2734516442594,-22.35225107234309,53.5],"spkA":[-468.5,3.5,25],"spkB":[468.5,3.5,25],"dirA":[0.8376105968386142,0.5462677805469223,-0.15],"dirB":[-0.8376105968386142,0.5462677805469223,-0.15],"antA":[-462,2.5,95.2],"antB":[462,2.5,95.2],"panelA":[-385.3197261502687,-34.51546107710722,164],"panelB":[385.3197261502687,-34.51546107710722,164],"micA":[-452.5,1.7,29],"micB":[452.5,1.7,29]},"scopes":{"A":{"x0":-441.6,"x1":-415,"z0":6,"z1":24,"y":52},"B":{"x0":406.4,"x1":433,"z0":6,"z1":24,"y":52}},"soundWorldPerM":150,"soundMs":343,"sea":190};
const stage = document.querySelector(".pc-stage");
const backSvg = stage.querySelector("svg.pc-back");
const frontSvg = stage.querySelector("svg.pc-front");
const part = (name, root = stage) => root.querySelector(`[data-part="${name}"]`);
const still = matchMedia("(prefers-reduced-motion: reduce)");
const LIGHT = document.body.dataset.theme === "light" ? 1 : 0;
const readout = document.querySelector("[data-readout]");
const W = D.W, H = D.H;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ------------------------------------------------------------ the conversation (sim time, ms)
const LOOP = 4800;
const SCRIPT = [
  { side: "A", t0: 200, t1: 1600, f0: 0.19 },
  { side: "B", t0: 1950, t1: 3150, f0: 0.12 },
  { side: "A", t0: 3450, t1: 4250, f0: 0.19 },
];
const F0 = { A: 0.19, B: 0.12 }; // fundamental, kHz: Elif ~190 Hz, Sam ~120 Hz
let manual = [];
let talking = true; // false after hang-up
function env(side, t) {
  if (!talking && !manual.length) return 0;
  let e = 0;
  if (talking && t >= 0) {
    const m = ((t % LOOP) + LOOP) % LOOP;
    for (const u of SCRIPT) if (u.side === side) e = Math.max(e, smoothstep(u.t0 - 8, u.t0, m) * (1 - smoothstep(u.t1 - 40, u.t1, m)));
  }
  for (const u of manual) if (u.side === side) e = Math.max(e, smoothstep(u.t0 - 8, u.t0, t) * (1 - smoothstep(u.t1, u.t1 + 40, t)));
  // syllables: the voice swells and dips about five times a second
  const syl = 0.55 + 0.45 * Math.pow(Math.sin((t / 210) * Math.PI), 2);
  return e * syl;
}
function voice(side, t) {
  const f = F0[side], w = 2 * Math.PI;
  return env(side, t) * (0.5 * Math.sin(w * f * t) + 0.28 * Math.sin(w * 2 * f * t + 1) + 0.16 * Math.sin(w * 3.3 * f * t + 2) + 0.08 * Math.sin(w * 3 * t));
}

// ------------------------------------------------------------ paths and timing (from the model)
let route = "volte", level = "beginner";
let timing = {};
function buildTiming() {
  const segs = D.segs[route];
  for (const key of ["AB", "BA"]) {
    const nodes = D.paths[key];
    const sum = {};
    for (let i = 1; i < nodes.length; i++) sum[nodes[i].seg] = (sum[nodes[i].seg] || 0) + nodes[i].w;
    const cum = [0];
    for (let i = 1; i < nodes.length; i++) {
      const n = nodes[i];
      const ms = (segs[n.seg] || 0) * (sum[n.seg] ? n.w / sum[n.seg] : 0);
      cum.push(cum[i - 1] + ms);
    }
    timing[key] = { nodes, cum, total: cum[cum.length - 1] };
  }
  const b = D.budgets[route];
  let acc = 0;
  stepStart = b.map((s) => { const v = acc; acc += s.ms; return v; });
  stepMs = b.map((s) => s.ms);
  totalMs = acc;
}
let stepStart = [], stepMs = [], totalMs = 0;
function where(key, age) {
  const { nodes, cum, total } = timing[key];
  if (age <= 0) return { p: nodes[0].p, seg: "start", show: false, i: 0 };
  if (age >= total) return { p: nodes[nodes.length - 1].p, seg: "done", show: false, i: nodes.length };

// ------------------------------------------------------------ WebGL: sound and radio in the air, light in the fibre
const FRAGMENT = `
uniform vec4 uSrc[4];
uniform vec4 uSrcB[4];
uniform vec4 uSrcD[4];
uniform vec4 uRad[4];
uniform vec4 uRadB[4];
uniform vec4 uRadD[4];

    vec4 s=uSrc[i];vec4 b=uSrcB[i];

  for(int i=0;i<4;i++){
    vec4 s=uRad[i];vec4 b=uRadB[i];

  fragment: FRAGMENT,

const fallback = part("fallback");

// ------------------------------------------------------------ the scopes
function scopeTrace(side, getV, startMs, spanMs, showSamples) {
  const sc = D.scopes[side];
  const x0 = sc.x0 + 1, x1 = sc.x1 - 1, mid = -(sc.z0 + sc.z1) / 2 - 1.2, amp = (sc.z1 - sc.z0) * 0.32;
  const n = 90;
  let d = "";
  for (let i = 0; i <= n; i++) {
    const t = startMs + (i / n) * spanMs;
    d += (i ? "L" : "M") + (x0 + (i / n) * (x1 - x0)).toFixed(2) + " " + (mid - getV(t) * amp).toFixed(2);
  }
  let s = "";
  const dt = 1 / 16; // 16 kHz sampling: one sample every 62.5 µs
  if (showSamples) {
    const first = Math.ceil(startMs / dt) * dt;
    for (let t = first; t <= startMs + spanMs; t += dt) {
      const x = x0 + ((t - startMs) / spanMs) * (x1 - x0);
      s += "M" + x.toFixed(2) + " " + (mid - getV(t) * amp).toFixed(2) + "h0";
    }
  }
  return { d, s, x0, x1, bottom: -sc.z0 - 1.4 };
}

// ------------------------------------------------------------ text panel
const text = (name) => document.querySelector(`[data-text="${name}"]`);

// ------------------------------------------------------------ frame
const ledGroups = ["cabA", "rackA", "landA", "cabB", "rackB", "landB"].map((n) => ({ el: part("led-" + n.slice(0, -1) + n.slice(-1)), n }));

let lastTextKey = "";

function draw(dtWall) {
  const live = [...liveOf("AB"), ...liveOf("BA")];
  const zoom = box[2] / W;
  // packets
  let n = 0;
  const glow = new Float32Array(64);
  let g = 0;
  for (const f of live) {
    if (!f.show || f.seg === "air" || f.seg === "ear" || n >= POOL) continue;
    const c = iso3(f.p);
    const dot = dots[n++];
    dot.setAttribute("cx", c[0].toFixed(2));
    dot.setAttribute("cy", c[1].toFixed(2));
    dot.setAttribute("r", (0.7 + 1.5 * zoom).toFixed(2));
    dot.setAttribute("data-dir", f.dir);
    dot.setAttribute("opacity", (0.45 + 0.55 * clamp(f.a * 1.6, 0, 1)).toFixed(2));
    if (g < 16 && ["overland", "sea", "metro", "coreOut", "coreIn"].includes(f.seg)) { glow.set([f.p[0], f.p[1], f.p[2], 0.55 * f.a + 0.25], g * 4); g++; }
  }
  for (; n < POOL; n++) if (dots[n].getAttribute("r") !== "0") dots[n].setAttribute("r", "0");
  // station lights
  for (const { el, n: name } of ledGroups) {
    const kind = name.slice(0, -1), side = name.slice(-1);
    const sx = side === "A" ? -1 : 1;
    const on = live.some((f) => LED_SEGS[kind].includes(f.seg) && Math.sign(f.p[0]) === sx && Math.abs(Math.abs(f.p[0]) - { cab: 350, rack: 300, land: 223 }[kind]) < 26);

    const rf = live.some((f) => (f.dir === out && f.seg === "uplink") || (f.dir === inn && f.seg === "downlink"));
    parts["trMic" + side].setAttribute("opacity", audio ? "1" : "0");
    parts["trRf" + side].setAttribute("opacity", rf ? "1" : "0");
    parts["ant" + side].setAttribute("data-tone", rf ? "lit" : "mid");
    const e = env(side, T);
    parts["mouth" + side].setAttribute("ry", (0.35 + 1.7 * e * (0.6 + 0.4 * Math.abs(Math.sin(T / 37)))).toFixed(2));
    const other = side === "A" ? "B" : "A";
    const playT = T - timing[inn].total + D.segs[route].ear;
    const play = voice(other, playT);
    parts["cone" + side].setAttribute("transform", coneBase[side] + ` translate(0 ${(-play * 0.5).toFixed(2)})`);

    const tr = scopeTrace(side, sig, T - span, span, span <= 6);

// ------------------------------------------------------------ loop
let frame = 0, last = 0, visibleOnScreen = false;
function tick(now) {
  const dt = last ? Math.min(now - last, 50) : 16;
  last = now;
  wallClock += dt;
  if (playing) {
    const age = T - leadBorn;
    const step = stepOfAge(age);
    if (speedMode === "auto") {
      const target = warpFor(step);
      warp = Math.exp(lerp(Math.log(warp), Math.log(target), 1 - Math.exp(-dt / 450)));
    } else warp = +speedMode;
    T += dt * warp;
    if (follow) {
      boxTarget = [...D.boxes[STATION[step]]];
      if (step === 10) {
        overviewWall += dt;
        if (overviewWall > 16000 && talking) restartLead();
      } else overviewWall = 0;
    }
  }
  for (let i = 0; i < 4; i++) box[i] = lerp(box[i], boxTarget[i], 1 - Math.exp(-dt / 380));
  draw(dt);
  frame = visibleOnScreen ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visibleOnScreen && !still.matches) { last = 0; frame = requestAnimationFrame(tick); } }
function stillFrame() { box = [...boxTarget]; draw(16); }
function restartLead() {
  const m = ((T % LOOP) + LOOP) % LOOP;
  const next = T - m + LOOP + SCRIPT[0].t0;
  leadBorn = next;
  T = next - 0.15;
  overviewWall = 0;
  warp = warpFor(1);
}
new IntersectionObserver((entries) => { visibleOnScreen = entries[entries.length - 1].isIntersecting; if (visibleOnScreen) run(); }, { rootMargin: "120px 0px" }).observe(stage);

// ------------------------------------------------------------ interaction

  if (speedMode === "auto") warp = warpFor(step);
  boxTarget = [...D.boxes[STATION[step]]];
  overviewWall = 0;

}

  manual = [];

  T = leadBorn - 0.15;
  follow = true;
  playing = true;
  speedMode = "auto";
  setPressed("speed", "speed", "auto");
  warp = warpFor(1);
  document.querySelector('[data-act="play"]').textContent = "Pause";
  document.querySelector('[data-act="play"]').setAttribute("aria-pressed", "true");
  document.querySelector('[data-act="call"]').textContent = "Hang up";

}

  b.textContent = playing ? "Pause" : "Play";
  b.setAttribute("aria-pressed", String(playing));
}
document.querySelector(".pc-bar").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.act === "call") (talking && b.textContent === "Hang up" ? hangUp : call)();
  else if (b.dataset.act === "play") togglePlay();
  else if (b.dataset.act === "zoom") { follow = false; boxTarget = [...D.boxes.all]; focusStep = 10; }
  else if (b.dataset.speed) {
    speedMode = b.dataset.speed;
    setPressed("speed", "speed", speedMode);
    if (speedMode === "auto") follow = true;
    togglePlay(true);
  }
  if (still.matches) stillFrame();
});
for (const side of ["A", "B"]) {
  const b = document.querySelector(`[data-act="talk${side}"]`);
  const start = (e) => { e.preventDefault(); b.setAttribute("data-held", ""); const t0 = Math.ceil((T + 30) / 20) * 20; manual.push({ side, t0, t1: Infinity }); if (side === "A") { leadBorn = t0; follow = true; } };
  const stop = () => { b.removeAttribute("data-held"); for (const u of manual) if (u.side === side && u.t1 === Infinity) u.t1 = T; };
  b.addEventListener("pointerdown", start);
  b.addEventListener("pointerup", stop);
  b.addEventListener("pointerleave", stop);
  b.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) start(e); });
  b.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") stop(); });
}
document.querySelector(".pc-learn").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.level) { level = b.dataset.level; setPressed("level", "level", level); lastTextKey = ""; }
  else if (b.dataset.route) { route = b.dataset.route; setPressed("route", "route", route); stage.setAttribute("data-route", route); buildTiming(); renderBars(); lastTextKey = ""; goStep(focusStep); }
  else if (b.dataset.step && b.classList.contains("pc-step")) goStep(+b.dataset.step);
  if (still.matches) stillFrame(); else draw(0);
});
// click the drawing: zoom into the part under the pointer, or back out
stage.addEventListener("click", (e) => {
  const r = stage.getBoundingClientRect();
  const vx = box[0] + ((e.clientX - r.left) / r.width) * box[2];
  const vy = box[1] + ((e.clientY - r.top) / r.height) * box[3];
  if (stage.hasAttribute("data-zoomed")) { follow = false; boxTarget = [...D.boxes.all]; focusStep = 10; if (still.matches) stillFrame(); return; }
  let best = null, bestD = Infinity;
  for (const [name, b] of Object.entries(D.boxes)) {
    if (name === "all") continue;
    const cx = b[0] + b[2] / 2, cy = b[1] + b[3] / 2;
    const inside = vx > b[0] && vx < b[0] + b[2] && vy > b[1] && vy < b[1] + b[3];
    const d = Math.hypot((vx - cx) / b[2], (vy - cy) / b[3]);
    if (inside && d < bestD) { best = name; bestD = d; }
  }
  if (!best) return;
  follow = false;
  boxTarget = [...D.boxes[best]];
  focusStep = STEP_OF_STATION[best];
  if (still.matches) stillFrame();
});
stage.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); goStep(Math.min(10, focusStep + 1)); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goStep(Math.max(1, focusStep - 1)); }
  else if (e.key === "Escape") { follow = false; boxTarget = [...D.boxes.all]; }
  else if (e.key === "1" || e.key === "2" || e.key === "3") { level = ["beginner", "intermediate", "advanced"][+e.key - 1]; setPressed("level", "level", level); lastTextKey = ""; }
  if (still.matches) stillFrame();
});
window.addEventListener("resize", () => { if (!frame) draw(0); });

// ------------------------------------------------------------ start
buildTiming();
renderBars();
document.querySelector('[data-act="call"]').textContent = "Hang up";
T = leadBorn - 0.15;
warp = warpFor(1);
boxTarget = [...D.boxes.voiceA];
box = [...D.boxes.all];
if (still.matches) { playing = false; goStep(1); }
else draw(16);
window.__pc = { get T() { return T; }, set T(v) { T = v; }, goStep, get warp() { return warp; }, timing: () => timing, call };
</script></body></html>
